# ==========================================================
#  LoupGarouMC — configuration
#  Les arènes (spawns, point d'attente, composition) sont dans arenas.yml
#  et se règlent en jeu : /lg arena create <nom> puis /lg arena edit <nom>
# ==========================================================

# Joueurs minimum pour lancer une partie (le maximum = nombre de spawns de l'arène, 16 max)
min-players: 5

# Lancement automatique dès que l'arène a assez de joueurs (compte à rebours timers.lobby,
# réduit à 10 s quand l'arène est pleine). false = seul un admin lance avec /lg start.
auto-start: true

# Tête de loup dans la barre d'action : clic droit pour choisir une arène
join-item:
  enabled: true
  slot: 3            # 0 à 8 (3 = 4e case de la barre)
  # Mondes où la tête est donnée (/lg slot monde ajoute le tien). Vide = monde du hub (/lg setlobby),
  # sinon le monde principal du serveur.
  worlds: []
  # Rayon (en blocs) autour du point /lg setlobby où la tête est donnée. 0 = tout le monde.
  # Utile si tes autres mini-jeux sont dans le même monde que le hub. (/lg slot zone <rayon>)
  radius: 0

# Les joueurs restent sur leur spawn pendant toute la partie
freeze-players: true

# Quand un rôle est mort, le narrateur l'appelle quand même (durée aléatoire)
# pour ne pas révéler qui est encore en vie.
fake-steps-for-dead-roles: true

# Maire : élu le premier jour, voix double, départage les égalités,
# peut lancer le vote plus tôt, prolonger le débat ou clore le vote.
mayor:
  enabled: true
  double-vote: true
  extend-seconds: 30
  max-extends: 2

# Durées en secondes
timers:
  lobby: 30          # compte à rebours du lancement automatique
  countdown: 10      # compte à rebours quand un admin lance
  distribution: 12
  cupid: 30
  lovers: 10
  seer: 25
  guard: 25
  wolves: 45
  witch: 30
  mayor: 40          # élection du Maire
  discussion: 120    # le Maire peut couper avant
  vote: 45           # le Maire peut clore avant
  hunter: 20
  succession: 20     # le Maire mourant désigne son successeur
  summary: 30        # durée du résumé 3D de fin de partie

# Composition automatique (quand une arène est en mode « auto » dans /lg admin)
roles:
  # 1 loup-garou pour X joueurs (minimum 1)
  players-per-wolf: 4
  # Nombre minimum de joueurs pour ajouter le rôle (0 = désactivé)
  voyante: 5
  sorciere: 6
  chasseur: 6
  cupidon: 8
  salvateur: 9

# Resource pack (cartes + menus). Héberge le zip et colle son lien direct ici.
# Laisse sha1 vide pour qu'il soit calculé automatiquement.
resource-pack:
  url: ""
  sha1: ""
  required: false

# Monde du hub (rempli par /lg setlobby) : la tête de loup y est donnée
lobby-world: ""
