name: LoupGarouMC
version: '${version}'
main: fr.cleangang.loupgarou.LoupGarouPlugin
api-version: '1.21'
description: Mini-jeu Loup-Garou avec cartes de rôle et menus custom
authors: [Simon]

commands:
  lg:
    description: Mini-jeu Loup-Garou
    usage: /lg <arenes|join|leave|arena|admin|start|stop|menu|carte|test>
    aliases: [loupgarou]

permissions:
  loupgarou.play:
    default: true
  loupgarou.admin:
    default: op
